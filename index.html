<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      overflow:hidden;
    }
  </style>
</head>

<body>

  <model-viewer
    src="maqueta.glb"

    ar
    ar-placement="floor"
    ar-modes="webxr scene-viewer quick-look"

    camera-controls
    auto-rotate

    shadow-intensity="1"

    style="width:100vw; height:100vh;"
  >
  </model-viewer>

</body>
</html>
