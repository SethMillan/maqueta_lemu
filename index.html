<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      overflow:hidden;
    }

    model-viewer{
      width:100vw;
      height:100vh;
      background:#f5f5f5;
    }
  </style>
</head>

<body>

  <model-viewer
    src="/maqueta.glb"

    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-scale="fixed"
    ar-placement="floor"

    camera-controls
    auto-rotate

    shadow-intensity="1"

    environment-image="neutral"
  >
  </model-viewer>

</body>
</html>
